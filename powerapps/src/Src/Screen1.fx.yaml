"Screen1 As screen.'autoLayout_HeaderFooter_ver1.0'":
    CopilotContext: |-
        ={ ScreenName: Self.Name }
    CopilotPromptSuggestions: =[]
    LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    OnVisible: |-
        =Set(varShownAt, Now());
        Trace("queue_opened", TraceSeverity.Information,
              {open_items: CountRows(Filter('review.item', status = "open"))})

    lblTitle As label:
        BorderColor: =RGBA(0, 0, 0, 0)
        BorderStyle: =BorderStyle.None
        BorderThickness: =2
        Color: =RGBA(50, 49, 48, 1)
        DisabledBorderColor: =RGBA(0, 0, 0, 0)
        DisabledColor: =RGBA(161, 159, 157, 1)
        FocusedBorderThickness: =4
        Font: =Font.'Segoe UI'
        Height: =50
        Size: =20
        Text: |-
            ="Review queue: " & CountRows(Filter('review.item', status = "open")) & " open · " & CountRows(Filter('review.item', status <> "open")) & " done"
        Width: =1326
        X: =20
        Y: =10
        ZIndex: =1

    imgDoc As image:
        BorderColor: =RGBA(0, 0, 0, 0)
        BorderStyle: =BorderStyle.None
        BorderThickness: =2
        DisabledBorderColor: =RGBA(0, 0, 0, 0)
        DisabledFill: =RGBA(0, 0, 0, 0)
        FocusedBorderThickness: =4
        Height: =520
        HoverBorderColor: =RGBA(0, 0, 0, 0)
        HoverFill: =RGBA(0, 0, 0, 0)
        Image: =LookUp('review.document', doc_id = galQueue.Selected.doc_id).page_image
        PressedBorderColor: =RGBA(0, 0, 0, 0)
        PressedFill: =RGBA(0, 0, 0, 0)
        Width: =560
        X: =395
        Y: =105
        ZIndex: =2

    "galQueue As gallery.'BrowseLayout_Vertical_TwoTextVariant_ver5.0'":
        BorderColor: =RGBA(245, 245, 245, 1)
        DelayItemLoading: =true
        Height: =680
        OnSelect: |-
            =Set(varShownAt, Now());
            Trace("item_viewed", TraceSeverity.Information,
                  {item_id: galQueue.Selected.item_id, field: galQueue.Selected.field, method: galQueue.Selected.method,
                   layout: galQueue.Selected.layout, confidence: galQueue.Selected.confidence})
        Default: =First(SortByColumns(Filter('review.item', status = "open"), "item_id"))
        Items: =SortByColumns(Filter('review.item', status = "open"), "item_id")
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TemplatePadding: =0
        TemplateSize: =90
        Width: =360
        X: =20
        Y: =70
        ZIndex: =3

        Title1 As label:
            Color: =RGBA(50, 49, 48, 1)
            DisabledColor: =RGBA(161, 159, 157, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
            Height: =Self.Size * 1.8
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =12
            PaddingRight: =0
            PaddingTop: =0
            Text: =ThisItem.doc_id & "  " & ThisItem.field_label
            VerticalAlign: =VerticalAlign.Top
            Width: =Parent.TemplateWidth - 86
            X: =1
            Y: =(Parent.TemplateHeight - (Self.Size * 1.8 + Subtitle3.Size * 1.8)) / 2
            ZIndex: =1

        Subtitle3 As label:
            Color: =RGBA(96, 94, 92, 1)
            DisabledColor: =RGBA(161, 159, 157, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
            Height: =Self.Size * 1.8
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =12
            PaddingRight: =0
            PaddingTop: =0
            Size: =12
            Text: |-
                =Text(ThisItem.extracted_value, "#,##0.00") & "  ·  conf " & Text(ThisItem.confidence, "0.00")
            VerticalAlign: =VerticalAlign.Top
            Width: =Title1.Width
            X: =1
            Y: =Title1.Y + Title1.Height
            ZIndex: =2

        NextArrow3 As icon.ChevronRight:
            AccessibleLabel: =Self.Tooltip
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =RGBA(166, 166, 166, 1)
            DisabledBorderColor: =RGBA(245, 245, 245, 1)
            DisabledColor: =RGBA(225, 223, 221, 1)
            DisabledFill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =4
            Height: =50
            HoverBorderColor: =RGBA(0, 0, 0, 0)
            HoverColor: =RGBA(16, 110, 190, 1)
            HoverFill: =RGBA(0, 0, 0, 0)
            Icon: =Icon.ChevronRight
            OnSelect: =Select(Parent)
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            PressedBorderColor: =RGBA(0, 0, 0, 0)
            PressedColor: =RGBA(16, 110, 190, 1)
            PressedFill: =RGBA(0, 0, 0, 0)
            Tooltip: ="View item details"
            Width: =50
            Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
            ZIndex: =3

        Separator3 As rectangle:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(255, 255, 255, 1)
            Height: =8
            OnSelect: =Select(Parent)
            Width: =Parent.TemplateWidth
            Y: =Parent.TemplateHeight - Self.Height
            ZIndex: =4

        Rectangle3 As rectangle:
            BorderColor: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 120, 212, 1)
            Height: =Parent.TemplateHeight - Separator3.Height
            OnSelect: =Select(Parent)
            Visible: =ThisItem.IsSelected
            Width: =1
            ZIndex: =5

    lblField As label:
        BorderColor: =RGBA(0, 0, 0, 0)
        BorderStyle: =BorderStyle.None
        BorderThickness: =2
        Color: =RGBA(50, 49, 48, 1)
        DisabledBorderColor: =RGBA(0, 0, 0, 0)
        DisabledColor: =RGBA(161, 159, 157, 1)
        FocusedBorderThickness: =4
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Size: =15
        Text: =galQueue.Selected.field_label
        Width: =370
        X: =975
        Y: =70
        ZIndex: =4
        Height: =40

    lblValue As label:
        BorderColor: =RGBA(0, 0, 0, 0)
        BorderStyle: =BorderStyle.None
        BorderThickness: =2
        Color: =RGBA(50, 49, 48, 1)
        DisabledBorderColor: =RGBA(0, 0, 0, 0)
        DisabledColor: =RGBA(161, 159, 157, 1)
        FocusedBorderThickness: =4
        Font: =Font.'Segoe UI'
        Size: =13
        Text: |-
            ="Extracted: " & Text(galQueue.Selected.extracted_value, "#,##0.00")
        Width: =370
        X: =975
        Y: =115
        ZIndex: =5
        Height: =35

    lblConf As label:
        BorderColor: =RGBA(0, 0, 0, 0)
        BorderStyle: =BorderStyle.None
        BorderThickness: =2
        Color: =RGBA(50, 49, 48, 1)
        DisabledBorderColor: =RGBA(0, 0, 0, 0)
        DisabledColor: =RGBA(161, 159, 157, 1)
        FocusedBorderThickness: =4
        Font: =Font.'Segoe UI'
        Size: =13
        Text: |-
            ="Confidence: " & Text(galQueue.Selected.confidence, "0.00")
        Width: =370
        X: =975
        Y: =150
        ZIndex: =6
        Height: =35

    lblWhy As label:
        BorderColor: =RGBA(0, 0, 0, 0)
        BorderStyle: =BorderStyle.None
        BorderThickness: =2
        Color: =RGBA(50, 49, 48, 1)
        DisabledBorderColor: =RGBA(0, 0, 0, 0)
        DisabledColor: =RGBA(161, 159, 157, 1)
        FocusedBorderThickness: =4
        Font: =Font.'Segoe UI'
        Size: =12
        Text: |-
            ="Why flagged: " & galQueue.Selected.reason_help
        Width: =370
        X: =975
        Y: =190
        ZIndex: =7
        Height: =65

    txtValue As text:
        BorderColor: =RGBA(245, 245, 245, 1)
        BorderThickness: =2
        Color: =RGBA(50, 49, 48, 1)
        Default: =Text(galQueue.Selected.extracted_value)
        DisabledBorderColor: =RGBA(0, 0, 0, 0)
        DisabledColor: =RGBA(161, 159, 157, 1)
        DisabledFill: =RGBA(242, 242, 241, 0)
        FocusedBorderThickness: =4
        Font: =Font.'Segoe UI'
        Format: =TextFormat.Number
        HoverBorderColor: =RGBA(16, 110, 190, 1)
        HoverColor: =RGBA(50, 49, 48, 1)
        HoverFill: =RGBA(255, 255, 255, 1)
        PressedBorderColor: =RGBA(0, 120, 212, 1)
        PressedColor: =RGBA(50, 49, 48, 1)
        PressedFill: =RGBA(255, 255, 255, 1)
        RadiusBottomLeft: =0
        RadiusBottomRight: =0
        RadiusTopLeft: =0
        RadiusTopRight: =0
        Size: =13
        Width: =370
        X: =975
        Y: =370
        ZIndex: =8
        Height: =42

    btnAccept As button:
        BorderColor: =RGBA(0, 0, 0, 0)
        BorderStyle: =BorderStyle.None
        DisabledBorderColor: =RGBA(0, 0, 0, 0)
        DisabledColor: =RGBA(161, 159, 157, 1)
        DisabledFill: =RGBA(242, 242, 241, 0)
        Fill: =RGBA(0, 120, 212, 1)
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Semibold
        HoverBorderColor: =RGBA(0, 0, 0, 0)
        HoverColor: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(16, 110, 190, 1)
        OnSelect: |-
            =Trace("review_decision", TraceSeverity.Information,
                  {decision: "accepted", item_id: galQueue.Selected.item_id, field: galQueue.Selected.field,
                   method: galQueue.Selected.method, layout: galQueue.Selected.layout,
                   confidence: galQueue.Selected.confidence,
                   seconds_on_item: DateDiff(varShownAt, Now(), TimeUnit.Seconds)});
            Patch('review.item', galQueue.Selected,
                    {status: "accepted", reviewed_value: galQueue.Selected.extracted_value,
                     reviewer: User().Email, reviewed_at: Now()});
            Refresh('review.item');
            Set(varShownAt, Now())
        PressedBorderColor: =RGBA(0, 69, 120, 1)
        PressedColor: =RGBA(255, 255, 255, 1)
        PressedFill: =RGBA(16, 110, 190, 1)
        RadiusBottomLeft: =0
        RadiusBottomRight: =0
        RadiusTopLeft: =0
        RadiusTopRight: =0
        Size: =15
        Text: ="Accept"
        X: =975
        Y: =420
        ZIndex: =9
        Width: =370
        Height: =42

    btnCorrect As button:
        BorderColor: =RGBA(0, 0, 0, 0)
        BorderStyle: =BorderStyle.None
        DisabledBorderColor: =RGBA(0, 0, 0, 0)
        DisabledColor: =RGBA(161, 159, 157, 1)
        DisabledFill: =RGBA(242, 242, 241, 0)
        Fill: =RGBA(0, 120, 212, 1)
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Semibold
        HoverBorderColor: =RGBA(0, 0, 0, 0)
        HoverColor: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(16, 110, 190, 1)
        OnSelect: |-
            =If(IsBlank(txtValue.Text) || IsError(Value(txtValue.Text)),
                 Notify("Enter the value printed on the document", NotificationType.Warning),
                 Trace("review_decision", TraceSeverity.Information,
                       {decision: "corrected", item_id: galQueue.Selected.item_id, field: galQueue.Selected.field,
                        method: galQueue.Selected.method, layout: galQueue.Selected.layout,
                        confidence: galQueue.Selected.confidence,
                        seconds_on_item: DateDiff(varShownAt, Now(), TimeUnit.Seconds)});
                 Patch('review.item', galQueue.Selected,
                       {status: "corrected", reviewed_value: Value(txtValue.Text),
                        reviewer: User().Email, reviewed_at: Now()});
                 Refresh('review.item');
                 Set(varShownAt, Now()))
        PressedBorderColor: =RGBA(0, 69, 120, 1)
        PressedColor: =RGBA(255, 255, 255, 1)
        PressedFill: =RGBA(16, 110, 190, 1)
        RadiusBottomLeft: =0
        RadiusBottomRight: =0
        RadiusTopLeft: =0
        RadiusTopRight: =0
        Size: =15
        Text: ="Save Correction"
        X: =975
        Y: =470
        ZIndex: =10
        Width: =370
        Height: =42

    btnNotOnDoc As button:
        BorderColor: =RGBA(0, 0, 0, 0)
        BorderStyle: =BorderStyle.None
        DisabledBorderColor: =RGBA(0, 0, 0, 0)
        DisabledColor: =RGBA(161, 159, 157, 1)
        DisabledFill: =RGBA(242, 242, 241, 0)
        Fill: =RGBA(0, 120, 212, 1)
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Semibold
        Height: =42
        HoverBorderColor: =RGBA(0, 0, 0, 0)
        HoverColor: =RGBA(255, 255, 255, 1)
        HoverFill: =RGBA(16, 110, 190, 1)
        OnSelect: |-
            =Trace("review_decision", TraceSeverity.Information,
                  {decision: "not_on_document", item_id: galQueue.Selected.item_id, field: galQueue.Selected.field,
                   method: galQueue.Selected.method, layout: galQueue.Selected.layout,
                   confidence: galQueue.Selected.confidence,
                   seconds_on_item: DateDiff(varShownAt, Now(), TimeUnit.Seconds)});
            Patch('review.item', galQueue.Selected,
                    {status: "not_on_document", reviewed_value: Blank(),
                     reviewer: User().Email, reviewed_at: Now()});
            Refresh('review.item');
            Set(varShownAt, Now())
        PressedBorderColor: =RGBA(0, 69, 120, 1)
        PressedColor: =RGBA(255, 255, 255, 1)
        PressedFill: =RGBA(16, 110, 190, 1)
        RadiusBottomLeft: =0
        RadiusBottomRight: =0
        RadiusTopLeft: =0
        RadiusTopRight: =0
        Size: =15
        Text: ="Not on document"
        X: =975
        Y: =520
        ZIndex: =11
        Width: =370

    lblContext As label:
